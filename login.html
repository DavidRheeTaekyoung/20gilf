<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 20기 골프대회</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>20기 골프대회</h1>
    <p>로그인 및 회원가입</p>
  </header>

  <nav>
    <a href="index.html">홈</a>
    <a href="login.html" class="active">로그인</a>
    <a href="tournament.html">대회신청</a>
    <a href="about.html">운영진소개</a>
  </nav>

  <main>
    <div class="container">
      <section>
        <h2>간편 로그인</h2>
        <p class="text-center">소셜 계정으로 간편하게 로그인하세요</p>

        <div id="alert" class="alert"></div>

        <div style="max-width: 400px; margin: 2em auto;">
          <button id="googleLoginBtn" class="btn btn-oauth btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Google로 시작하기
          </button>

          <button id="naverLoginBtn" class="btn btn-oauth btn-naver">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
              <path d="M16.273 12.845L7.376 0H0v24h7.726V11.156L16.624 24H24V0h-7.727v12.845z"/>
            </svg>
            네이버로 시작하기
          </button>

          <div id="loginStatus" class="hidden" style="margin-top: 2em; text-align: center;">
            <p>로그인 중...</p>
            <div class="spinner"></div>
          </div>
        </div>
      </section>

      <!-- 로그인 후 기수 입력 섹션 (처음 로그인시에만 표시) -->
      <section id="profileSection" class="hidden">
        <h2>프로필 완성하기</h2>
        <p class="text-center">추가 정보를 입력해주세요</p>

        <form id="profileForm" style="max-width: 400px; margin: 2em auto;">
          <div class="form-group">
            <label for="name">이름 *</label>
            <input type="text" id="name" name="name" required placeholder="홍길동">
          </div>

          <div class="form-group">
            <label for="graduationClass">졸업 기수 *</label>
            <select id="graduationClass" name="graduationClass" required>
              <option value="">선택하세요</option>
              <option value="15">15기</option>
              <option value="16">16기</option>
              <option value="17">17기</option>
              <option value="18">18기</option>
              <option value="19">19기</option>
              <option value="20">20기</option>
              <option value="21">21기</option>
              <option value="22">22기</option>
              <option value="23">23기</option>
              <option value="24">24기</option>
              <option value="25">25기</option>
            </select>
          </div>

          <div class="form-group">
            <label for="phone">연락처</label>
            <input type="tel" id="phone" name="phone" placeholder="010-1234-5678">
          </div>

          <div class="form-group">
            <label for="company">회사/직장</label>
            <input type="text" id="company" name="company" placeholder="회사명">
          </div>

          <div class="form-group">
            <label for="position">직책</label>
            <input type="text" id="position" name="position" placeholder="직책">
          </div>

          <button type="submit" class="btn" style="width: 100%;">프로필 저장</button>
        </form>
      </section>

      <!-- 로그인 성공 후 표시 -->
      <section id="welcomeSection" class="hidden">
        <h2>환영합니다!</h2>
        <div id="userInfo" style="text-align: center; margin: 2em 0;">
          <p style="font-size: 1.2em;"><strong id="userName"></strong>님</p>
          <p><span id="userClass"></span>기</p>
        </div>

        <div style="text-align: center;">
          <a href="tournament.html" class="btn">대회 신청하기</a>
          <button id="logoutBtn" class="btn btn-secondary" style="margin-left: 1em;">로그아웃</button>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>© 2026 고교 20기 골프대회 추진위원회</p>
    <p>문의: golf20@example.com</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Firebase 설정 -->
  <script src="js/firebase-config.js"></script>

  <!-- 인증 로직 -->
  <script src="js/auth.js"></script>
</body>
</html>
